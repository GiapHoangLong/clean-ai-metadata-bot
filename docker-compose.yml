version: "3.8"

services:
  cleanai-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cleanai-metadata-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent SQLite database storage
      - ./data:/app/data
      # Temporary scratch buffer
      - ./scratch:/app/scratch
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
